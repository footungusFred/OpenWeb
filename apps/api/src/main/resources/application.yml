spring:
  application:
    name: openweb-api

  datasource:
    url: ${OPENWEB_DATABASE_URL:jdbc:postgresql://localhost:5432/openweb}
    username: ${OPENWEB_DATABASE_USERNAME:openweb}
    password: ${OPENWEB_DATABASE_PASSWORD:openweb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
